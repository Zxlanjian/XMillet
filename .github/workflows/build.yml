name: Build XMillet

on:
  push:
    branches: [ main, perf-patch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Use the runner's preinstalled Android SDK (android-actions/setup-android fails installing the deprecated 'tools' package)
      - name: Install SDK platform 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "platform-tools" || echo "::warning::sdkmanager could not install platforms;android-37"
          ls "$ANDROID_HOME/platforms" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XMillet-perf-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
